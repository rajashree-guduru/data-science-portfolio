{% extends 'base.html' %}{% block title %}Sign up{% endblock %}
{% block content %}
<div class="card mx-auto shadow-sm" style="max-width: 420px"><div class="card-body p-4">
  <h3 class="mb-3">Create an account</h3>
  {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
  <form method="post">
    <input class="form-control mb-2" name="username" placeholder="Username" required>
    <input class="form-control mb-3" name="password" type="password" placeholder="Password (8+ characters)" minlength="8" required>
    <button class="btn btn-primary w-100">Sign up</button>
  </form>
  <p class="mt-3 mb-0 text-muted">Have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</div></div>
{% endblock %}
